apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend-container

        image: preran1966/springboot-ecommerce-backend:latest

        ports:
        - containerPort: 8081

        env: 
         - name: SPRING_DATASOURCE_URL 
           value: jdbc:mysql://mysql-service:3306/ecommerce

         - name: SPRING_DATASOURCE_USERNAME 
           value: root 
           
         - name: SPRING_DATASOURCE_PASSWORD 
           value: root123